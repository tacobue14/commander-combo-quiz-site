<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>カード画像診断</title><link rel="stylesheet" href="./style.css"></head><body><main><header><h1>Scryfall画像診断</h1><p>実際の画像サーバーへのアクセスを確認します</p></header><section><div id="status">確認中…</div><div id="target" class="card-grid"></div><p><a href="./index.html">クイズに戻る</a></p></section></main><script src="./images.js"></script><script>
const names=["Kinnan, Bonder Prodigy","Basalt Monolith","Chatterfang, Squirrel General","Walking Ballista"];let done=0,ok=0;
for(const name of names){const card=document.createElement("div");card.className="card";const img=document.createElement("img");img.alt=name;const label=document.createElement("div");label.className="name";label.textContent=name;const fallback=document.createElement("div");fallback.className="fallback";fallback.textContent="読み込み失敗";img.onload=()=>{done++;ok++;update()};img.onerror=()=>{card.classList.add("failed");done++;update()};card.append(img,fallback,label);document.getElementById("target").append(card);const url=imageUrl(name);if(url){img.src=url;}else{img.onerror();}}
function update(){document.getElementById("status").textContent="表示成功 "+ok+" / "+done+"（全"+names.length+"枚） "+(done===names.length?(ok===names.length?"すべて成功":"失敗した画像があります。接続設定または配信先を確認してください。"):"")}
</script></body></html>
